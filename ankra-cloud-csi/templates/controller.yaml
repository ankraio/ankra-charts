apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ankra-cloud-csi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "ankra-cloud-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "ankra-cloud-csi.name" . }}-controller
      priorityClassName: {{ .Values.controller.priorityClassName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ankra-cloud-csi
          image: {{ include "ankra-cloud-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --operation-timeout={{ .Values.controller.operationTimeout }}
            {{- if .Values.defaultZone }}
            - --default-zone={{ .Values.defaultZone }}
            {{- end }}
          env:
            {{- include "ankra-cloud-csi.apiEnvironment" . | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- with include "ankra-cloud-csi.caVolumeMount" . | trim }}{{ . | nindent 12 }}{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=true
            - --default-fstype={{ .Values.storageClassDefaults.fsType }}
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --timeout={{ .Values.controller.sidecarTimeout }}
            - --retry-interval-max=5m
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --timeout={{ .Values.controller.sidecarTimeout }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --timeout={{ .Values.controller.sidecarTimeout }}
            - --handle-volume-inuse-error=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --timeout={{ .Values.controller.sidecarTimeout }}
            - --extra-create-metadata
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- with include "ankra-cloud-csi.caVolume" . | trim }}{{ . | nindent 8 }}{{- end }}
