{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ankra-cloud-csi.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.existingSecretKey }}: {{ required "set api.token or api.existingSecret" .Values.api.token | quote }}
{{- end }}
