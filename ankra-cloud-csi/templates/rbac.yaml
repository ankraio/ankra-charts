apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
---
# The union of what external-provisioner, -attacher, -resizer and -snapshotter need (their upstream rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses", "volumegroupsnapshotcontents"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ankra-cloud-csi.name" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "ankra-cloud-csi.name" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# Leader election of the controller's sidecars.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-controller-leases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ankra-cloud-csi.name" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "ankra-cloud-csi.name" . }}-controller-leases
  apiGroup: rbac.authorization.k8s.io
