{{- $kubeletDir := .Values.node.kubeletDir -}}
{{- $pluginDir := printf "%s/plugins/csi.ankra.cloud" $kubeletDir -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ankra-cloud-csi.name" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ankra-cloud-csi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        {{- include "ankra-cloud-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ include "ankra-cloud-csi.name" . }}-node
      priorityClassName: {{ .Values.node.priorityClassName }}
      # The host network reaches the metadata service (fd00:ec2::254, 169.254.169.254) from the server's own
      # address, which is how the service tells which server is asking.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ankra-cloud-csi
          image: {{ include "ankra-cloud-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --max-volumes-per-node={{ .Values.node.maxVolumesPerNode }}
          env:
            {{- include "ankra-cloud-csi.apiEnvironment" . | nindent 12 }}
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: {{ $kubeletDir }}
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
            - name: udev-dir
              mountPath: /run/udev
              readOnly: true
            {{- with include "ankra-cloud-csi.caVolumeMount" . | trim }}{{ . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
        - name: node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $pluginDir }}/csi.sock
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path={{ $pluginDir }}/csi.sock
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9809
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ $pluginDir }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ $kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ $kubeletDir }}
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        - name: udev-dir
          hostPath:
            path: /run/udev
            type: DirectoryOrCreate
        {{- with include "ankra-cloud-csi.caVolume" . | trim }}{{ . | nindent 8 }}{{- end }}
