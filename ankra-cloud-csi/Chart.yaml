apiVersion: v2
name: ankra-cloud-csi
description: CSI driver csi.ankra.cloud for Ankra Cloud block storage (dynamic volumes per tier, snapshots, clones, online expansion).
type: application
version: 0.2.0
appVersion: "v0.2.0"
kubeVersion: ">=1.27.0-0"
icon: https://ankra.io/images/apple-touch-icon.png
home: https://github.com/ankraio/ankra-cloud-csi
sources:
  - https://github.com/ankraio/ankra-cloud-csi
keywords:
  - ankra
  - ankra-cloud
  - csi
  - storage
  - block-storage
  - persistent-volumes
  - snapshots
maintainers:
  - name: Ankra AB
    email: admin@ankra.io
    url: https://ankra.io
annotations:
  category: Storage
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/prerelease: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/maintainers: |
    - name: Ankra AB
      email: admin@ankra.io
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/ankraio/ankra-cloud-csi
    - name: Documentation
      url: https://cloud.ankra.app/docs/kubernetes-csi
    - name: Helm repo (helm repo add)
      url: https://ankraio.github.io/ankra-charts
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/ankra-charts/ankra-cloud-ccm
  artifacthub.io/images: |
    - name: ankra-cloud-csi
      image: share.ankra.cloud/library/ankra-cloud-csi:v0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: csi-provisioner
      image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
    - name: csi-attacher
      image: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
    - name: csi-resizer
      image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
    - name: csi-snapshotter
      image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.1
    - name: csi-node-driver-registrar
      image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
    - name: livenessprobe
      image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "A local-nvme volume is created on the compute node that runs the scheduled node's server (create_storage placement.server_id), so attaching it no longer fails with 409 Conflict."
    - kind: changed
      description: "The default StorageClass is ankra-default: it names no tier, so every volume gets its zone's default storage tier and claims without a class work in zones without Ankra Storage. ankra-standard stays, no longer the default."
    - kind: changed
      description: "The API client is regenerated from the current Ankra Cloud OpenAPI document; a volume from a snapshot goes through the generated create_storage."
