# values-examples/multi-zone.yaml - a cluster whose nodes span UpCloud zones.
#
# UpCloud block storage volumes are zone-bound: a `fi-hel1` volume cannot be
# attached to a `fi-hel2` VM. The driver creates every volume in the zone its
# controller runs in and rejects requests for any other zone, so a cluster
# with nodes in several zones keeps its storage in one of them.
#
# The driver reports topology under the key `region` (set to the node's
# zone), and kubelet labels each node running the node plugin with it.
# csi-provisioner v5+ passes that topology to the driver and stamps
# `region In [<zone>]` on every new PV, so allowedTopologies must use the
# `region` key: a `topology.kubernetes.io/zone` term never matches what the
# provisioner compares it with and fails every WaitForFirstConsumer claim.

storageClasses:
  defaultClass: maxiops
  # WaitForFirstConsumer lets the scheduler pick a node in the storage zone
  # before the volume is created.
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Retain
  # Chart-wide allowedTopologies, applied to every tier. Must name the zone
  # the controller is pinned to below.
  allowedTopologies:
    - matchLabelExpressions:
        - key: region
          values:
            - fi-hel1

  maxiops:
    enabled: true
    name: upcloud-block-storage-maxiops
    extraParameters:
      # Filesystem to format with (ext4 default, xfs supported)
      csi.storage.k8s.io/fstype: xfs
    mountOptions:
      - noatime
      - nodiratime

  standard:
    enabled: true
    name: upcloud-block-storage-standard
    extraParameters:
      csi.storage.k8s.io/fstype: ext4

  hdd:
    enabled: false

snapshotClasses:
  delete:
    enabled: true
    isDefault: true
  # Retain SC for compliance backups before destructive changes.
  retain:
    enabled: true
    name: upcloud-csi-snapshotclass-retain

# Pin the controller to the storage zone: the driver creates volumes in the
# zone it runs in.
controller:
  replicaCount: 2
  nodeSelector:
    topology.kubernetes.io/zone: fi-hel1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/name: upcloud-csi
