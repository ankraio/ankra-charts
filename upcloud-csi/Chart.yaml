apiVersion: v2
name: upcloud-csi
description: UpCloud CSI block-storage driver for Kubernetes (vendored from upstream v1.5.1) with snapshot backup CronJob, multi-zone StorageClasses, Prometheus alerts & Grafana dashboard.
type: application
version: 0.5.0
appVersion: "v1.5.1"
kubeVersion: ">=1.34.0-0"
icon: https://ankra.io/images/apple-touch-icon.png

home: https://github.com/ankraio/ankra-charts/tree/main/upcloud-csi
sources:
  - https://github.com/ankraio/ankra-charts/tree/main/upcloud-csi
  - https://github.com/UpCloudLtd/upcloud-csi

keywords:
  - upcloud
  - csi
  - storage
  - block-storage
  - persistent-volumes
  - snapshots
  - backup
  - observability
  - prometheus
  - grafana
  - k3s

maintainers:
  - name: Ankra AB
    email: admin@ankra.io
    url: https://ankra.io

annotations:
  category: Storage
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/prerelease: "false"
  artifacthub.io/maintainers: |
    - name: Ankra AB
      email: admin@ankra.io
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/ankraio/ankra-charts
    - name: Helm repo (helm repo add)
      url: https://ankraio.github.io/ankra-charts
    - name: Upstream project
      url: https://github.com/UpCloudLtd/upcloud-csi
    - name: Upstream image (GHCR)
      url: https://ghcr.io/upcloudltd/upcloud-csi
    - name: Chart (OCI)
      url: oci://ghcr.io/ankraio/ankra-charts/upcloud-csi
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/ankra-charts/upcloud-ccm
  artifacthub.io/operator: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/images: |
    - name: upcloud-csi
      image: ghcr.io/upcloudltd/upcloud-csi:v1.5.1
    - name: csi-provisioner
      image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
    - name: csi-attacher
      image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
    - name: csi-resizer
      image: registry.k8s.io/sig-storage/csi-resizer:v2.3.0
    - name: csi-snapshotter
      image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.0
    - name: snapshot-controller
      image: registry.k8s.io/sig-storage/snapshot-controller:v8.7.0
    - name: csi-node-driver-registrar
      image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
    - name: snapshot-validation-webhook
      image: registry.k8s.io/sig-storage/snapshot-validation-webhook:v8.1.1
    - name: kubectl
      image: docker.io/alpine/k8s:1.35.10
    - name: busybox-test-hook
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      whitelisted: true
  artifacthub.io/changes: |
    - kind: security
      description: "The kubernetes-csi sidecars move from their 2022 releases to current ones: csi-provisioner v6.4.0, csi-attacher v4.13.0, csi-resizer v2.3.0, csi-snapshotter and snapshot-controller v8.7.0, csi-node-driver-registrar v2.18.0. The old tags carried dozens of critical and high CVEs, all fixed upstream."
    - kind: security
      description: "UpCloud CSI driver v1.5.1 (Go 1.26.10, golang.org/x/net v0.62.0), pinned by digest."
    - kind: changed
      description: "Requires Kubernetes 1.34 or newer, the minimum external-provisioner v6 supports."
    - kind: changed
      description: "csi-provisioner v5+ honours the topology the driver reports (key region): new PersistentVolumes get a region node affinity. StorageClass allowedTopologies must use the region key; controller.sidecarExtraArgs.provisioner can pass --feature-gates=Topology=false to keep the old behaviour."
    - kind: changed
      description: "Snapshot CRDs updated to external-snapshotter v8.7.0 (CEL validation). Helm installs crds/ only on first install, so existing clusters keep their CRDs until they are applied by hand."
    - kind: deprecated
      description: "The snapshot validation webhook is deprecated upstream: it now runs v8.1.1, its last release, and validates VolumeSnapshotClasses only."
    - kind: added
      description: "controller.sidecarExtraArgs appends arguments to each kubernetes-csi sidecar."
