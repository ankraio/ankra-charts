suite: default-sc hook job
templates:
  - templates/default-sc-job.yaml
release:
  name: ut
  namespace: kube-system

tests:
  - it: no hook by default (no documents)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders SA + ClusterRole + ClusterRoleBinding + Job when defaultClass set
    set:
      storageClasses.defaultClass: standard
    asserts:
      - hasDocuments:
          count: 4

  - it: Job runs the right target SC in env
    set:
      storageClasses.defaultClass: standard
    documentIndex: 3
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: TARGET_SC
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: upcloud-block-storage-standard
      - matchRegex:
          path: metadata.annotations["helm.sh/hook"]
          pattern: "post-install,post-upgrade"

  - it: SA and RBAC ride the same post hook event as the Job, earlier and without hook-succeeded
    set:
      storageClasses.defaultClass: standard
    asserts:
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - documentIndex: 1
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - documentIndex: 1
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - documentIndex: 2
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - documentIndex: 2
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - documentIndex: 3
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - documentIndex: 3
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"

  - it: validates defaultClass enum (schema-level)
    set:
      storageClasses.defaultClass: garbage
    asserts:
      - failedTemplate: {}

  - it: chart-level helper rejects defaultClass for a disabled tier
    set:
      storageClasses.defaultClass: maxiops
      storageClasses.maxiops.enabled: false
    asserts:
      - failedTemplate: {}
