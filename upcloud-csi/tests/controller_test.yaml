suite: controller statefulset
templates:
  - templates/controller-statefulset.yaml
  - templates/secret.yaml
release:
  name: ut
  namespace: kube-system

tests:
  - it: renders a StatefulSet with 5 containers
    template: templates/controller-statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: ut-upcloud-csi-controller
      - lengthEqual:
          path: spec.template.spec.containers
          count: 5

  - it: defaults to reusing the upcloud-ccm Secret
    template: templates/controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[4].env[1].valueFrom.secretKeyRef.name
          value: upcloud-ccm-credentials

  - it: creates a Secret when credentials.create=true and existingSecret=''
    template: templates/secret.yaml
    set:
      credentials.create: true
      credentials.existingSecret: ""
      credentials.username: u
      credentials.password: p
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: ut-upcloud-csi-credentials

  - it: honors global.imageRegistry
    template: templates/controller-statefulset.yaml
    set:
      global.imageRegistry: harbor.internal
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^harbor\\.internal/sig-storage/csi-provisioner[:@]"
      - matchRegex:
          path: spec.template.spec.containers[4].image
          pattern: "^harbor\\.internal/upcloudltd/upcloud-csi[:@]"

  - it: drops privileges everywhere in the controller pod
    template: templates/controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: pins to control-plane via nodeAffinity Exists (k3s-safe, no exact-match nodeSelector)
    template: templates/controller-statefulset.yaml
    asserts:
      # An exact-match nodeSelector of control-plane="" never matches k3s
      # (label value "true") and would wedge the controller as Pending, which
      # blocks all dynamic PVC provisioning. Default must be empty.
      - isNull:
          path: spec.template.spec.nodeSelector
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: node-role.kubernetes.io/control-plane
            operator: Exists

  - it: defaults every sidecar to its current kubernetes-csi release
    template: templates/controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
      - equal:
          path: spec.template.spec.containers[1].image
          value: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
      - equal:
          path: spec.template.spec.containers[2].image
          value: registry.k8s.io/sig-storage/csi-resizer:v2.3.0
      - equal:
          path: spec.template.spec.containers[3].image
          value: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.0
      - equal:
          path: spec.template.spec.containers[4].image
          value: ghcr.io/upcloudltd/upcloud-csi@sha256:6a47b1b3bc5eb90c91d5de9b1eac2eb221f71a8a0a26250fbdb7ad77e1a4aa6d

  - it: appends controller.sidecarExtraArgs to the matching sidecar only
    template: templates/controller-statefulset.yaml
    set:
      controller.sidecarExtraArgs.provisioner:
        - --feature-gates=Topology=false
      controller.sidecarExtraArgs.resizer:
        - --workers=20
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=Topology=false
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --feature-gates=Topology=false
      - contains:
          path: spec.template.spec.containers[2].args
          content: --workers=20
      - notContains:
          path: spec.template.spec.containers[3].args
          content: --workers=20

  - it: renders when controller.sidecarExtraArgs is null
    template: templates/controller-statefulset.yaml
    set:
      controller.sidecarExtraArgs: null
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 5
