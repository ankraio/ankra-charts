{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ankra-cloud-ccm.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ankra-cloud-ccm.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "set api.existingSecret to a Secret with the key token, or api.token" .Values.api.token | quote }}
  {{- if .Values.api.caBundle }}
  ca.crt: |
    {{- .Values.api.caBundle | nindent 4 }}
  {{- end }}
{{- end }}
