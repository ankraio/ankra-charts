apiVersion: v2
name: ankra-cloud-ccm
description: Kubernetes cloud controller manager for Ankra Cloud (node initialisation and Services of type LoadBalancer).
type: application
version: 0.1.1
appVersion: "v0.1.1"
kubeVersion: ">=1.29.0-0"
icon: https://ankra.io/images/apple-touch-icon.png
home: https://github.com/ankraio/ankra-cloud-ccm
sources:
  - https://github.com/ankraio/ankra-cloud-ccm
keywords:
  - ankra
  - ankra-cloud
  - cloud-controller-manager
  - ccm
  - load-balancer
maintainers:
  - name: Ankra AB
    email: admin@ankra.io
    url: https://ankra.io
annotations:
  category: Networking
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: networking
  artifacthub.io/prerelease: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/maintainers: |
    - name: Ankra AB
      email: admin@ankra.io
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/ankraio/ankra-cloud-ccm
    - name: Documentation
      url: https://cloud.ankra.app/docs/kubernetes-ccm
    - name: Helm repo (helm repo add)
      url: https://ankraio.github.io/ankra-charts
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/ankra-charts/ankra-cloud-csi
  artifacthub.io/images: |
    - name: ankra-cloud-ccm
      image: share.ankra.cloud/library/ankra-cloud-ccm:v0.1.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: fixed
      description: "Services of type LoadBalancer no longer stay pending on a get_zone_capabilities decode error: the zone's stage is read as the number the API sends."
    - kind: fixed
      description: "A load balancer created without the IPv4 annotation no longer gets the priced IPv4 address: public_ipv4 is always sent."
    - kind: fixed
      description: "Load balancers past the first page of list_load_balancers are found: the controller follows next_cursor."
    - kind: changed
      description: "The API client is synced with the current Ankra Cloud OpenAPI document, with a contract test on every hand-decoded document."
