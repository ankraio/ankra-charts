    appVersion: v0.3.1
    created: "2026-11-22T18:54:02.215581224Z"
    description: CSI driver csi.ankra.cloud for Ankra Cloud block storage (dynamic
      volumes per tier, snapshots, clones, online expansion).
    digest: b9569ec659d19e2a008398aae666c1285cb964237f592ab096a51731135bf8a2
    home: https://github.com/ankraio/ankra-cloud-csi
    icon: https://ankra.io/images/apple-touch-icon.png
    keywords:
    - ankra
    - ankra-cloud
    - csi
    - storage
    - block-storage
    - persistent-volumes
    - snapshots
    kubeVersion: '>=1.27.0-0'
    maintainers:
    - email: admin@ankra.io
      name: Ankra AB
      url: https://ankra.io
    name: ankra-cloud-csi
    sources:
    - https://github.com/ankraio/ankra-cloud-csi
    type: application
    urls:
    - https://ankraio.github.io/ankra-charts/ankra-cloud-csi-0.3.1.tgz
    version: 0.3.1
  - annotations:
      artifacthub.io/category: storage
      artifacthub.io/changes: |
        - kind: fixed
          description: "A local-nvme volume whose selected node sits on a host whose Ankra Local pool takes no new volumes fails CreateVolume with ResourceExhausted instead of FailedPrecondition, so external-provisioner drops the selected node and the scheduler picks another one."
        - kind: added
          description: "Storage capacity tracking: the driver implements GetCapacity from the Ankra Cloud API's get_server_storage_capacity, the CSIDriver sets storageCapacity and external-provisioner publishes a CSIStorageCapacity per node and StorageClass, so the scheduler binds a local-nvme claim only to a node whose Ankra Local pool has room for it. Before, a claim could be bound to a node whose pool refused the volume with 409 and wait until other volumes were deleted."
        - kind: added
          description: "Values capacity.enabled (default true), capacity.pollInterval (30s) and capacity.cacheTTL (10s)."
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: ankra-cloud-csi
          image: share.ankra.cloud/library/ankra-cloud-csi:v0.3.0
          platforms:
            - linux/amd64
            - linux/arm64
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
        - name: csi-snapshotter
