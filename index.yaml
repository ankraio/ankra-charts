  claude-code-openai-wrapper:
  - annotations:
      artifacthub.io/category: ai-machine-learning
      artifacthub.io/changes: |
        - kind: added
          description: "auth.method=session runs the wrapper on a Claude Code subscription session (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`) instead of a metered API key. The render refuses the mode without a token, the same way api-key mode refuses without ANTHROPIC_API_KEY."
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
