  ankra-cloud-csi:
  - annotations:
      artifacthub.io/category: storage
      artifacthub.io/changes: |
        - kind: fixed
          description: "A local-nvme volume refused because the Ankra Local pool of its node is full fails CreateVolume with ResourceExhausted again, so external-provisioner hands the claim back to the scheduler and the pod is placed on a node with room. The driver recognised the refusal by the wording of the API's detail, which the API has since reworded; it now reads the reason member of the problem document (not_available_in_zone with 409, capacity_unavailable with 503)."
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: ankra-cloud-csi
          image: share.ankra.cloud/library/ankra-cloud-csi:v0.3.1
          platforms:
            - linux/amd64
            - linux/arm64
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.1
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
