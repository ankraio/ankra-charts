# repositoryID is what Artifact Hub reads to grant the Verified Publisher label.
# scripts/artifacthub-sync-repo.sh writes it automatically when the API-key
# secrets are configured; the repository was registered by hand, so the ID is
# recorded here directly and this file stays the source of truth if gh-pages is
# ever rebuilt from scratch.
