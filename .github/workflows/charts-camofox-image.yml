name: charts-camofox-image

# Builds ghcr.io/ankraio/images/camofox-browser from jo-inc/camofox-browser at
# the tag pinned below, and pushes a cosign-signed image. Upstream publishes no
# container image of its own, so this repository is the image's source of truth.
#
# The build uses UPSTREAM's Dockerfile rather than a copy: it already downloads
# the pinned Camoufox bundle at build time, and forking it here would drift.
#
# amd64 only - upstream takes the Camoufox binary architecture as a build arg
# (ARG ARCH=x86_64), so one multi-arch build would ship an x86_64 Firefox inside
# an arm64 image. See images/camofox-browser/README.md.
#
# The chart pins the image by digest, so pushing a new image changes nothing
# until scripts/sync-image-digest.sh camofox-browser re-pins it and the chart
# version is bumped - deliberately, so a browser that renders untrusted pages in
# the agent's pod only moves through a reviewable chart release.
#
# Third-party actions are pinned by commit SHA - a tag can be moved.

on:
  push:
    branches: [main]
    paths:
      - "images/camofox-browser/**"
      - ".github/workflows/charts-camofox-image.yml"
  workflow_dispatch:

concurrency:
  group: charts-camofox-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/ankraio/images/camofox-browser
  UPSTREAM_REPO: jo-inc/camofox-browser
  UPSTREAM_TAG: v1.13.1

jobs:
  build-push:
    name: build and push the camofox-browser image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Check out the pinned upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream

      - name: Record what is being built
        id: upstream
        run: |
          set -euo pipefail
          commit="$(git -C upstream rev-parse HEAD)"
          if [[ ! -f upstream/Dockerfile ]]; then
            echo "::error::upstream ${UPSTREAM_REPO}@${UPSTREAM_TAG} has no Dockerfile"
            exit 1
          fi
          if [[ ! -f upstream/LICENSE ]]; then
            echo "::error::upstream ${UPSTREAM_REPO}@${UPSTREAM_TAG} has no LICENSE; refusing to redistribute it"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "building ${UPSTREAM_REPO} ${UPSTREAM_TAG} (${commit})"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: upstream
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.UPSTREAM_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.commit }}
            org.opencontainers.image.version=${{ env.UPSTREAM_TAG }}
            org.opencontainers.image.licenses=MIT

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the pushed image (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: What to do next
        run: |
          set -euo pipefail
          echo "pushed  ${IMAGE}:${UPSTREAM_TAG}"
          echo "digest  ${{ steps.push.outputs.digest }}"
          echo
          echo "The chart keeps pulling its previously pinned digest. To roll it:"
          echo "  ./scripts/sync-image-digest.sh camofox-browser"
          echo "  bump version: in hermes-agent/Chart.yaml"
          echo "  open a PR"
