name: charts-gateway-api-crds-lint

# Lint the chart, prove the vendored files still match upstream, and install it
# on a real cluster. The install is the check that matters: Helm stores the whole
# chart in its release Secret, and the API server refuses one over 1 MiB, which
# neither `helm lint` nor `helm template` can see.

on:
  pull_request:
    paths:
      - "gateway-api-crds/**"
      - "scripts/sync-gateway-api-crds.sh"
      - ".github/workflows/charts-gateway-api-crds-lint.yml"
  push:
    branches: [main]
    paths:
      - "gateway-api-crds/**"
      - "scripts/sync-gateway-api-crds.sh"
      - ".github/workflows/charts-gateway-api-crds-lint.yml"
  workflow_dispatch:

concurrency:
  group: charts-gateway-api-crds-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint, upstream match, real install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: shellcheck the sync script
        run: shellcheck scripts/sync-gateway-api-crds.sh

      - name: helm lint
        run: helm lint --strict gateway-api-crds

      - name: Vendored files match the upstream tag named by appVersion
        run: |
          set -euo pipefail
          tag="$(grep -E '^appVersion:' gateway-api-crds/Chart.yaml | awk '{print $2}' | tr -d '"')"
          version="$(grep -E '^version:' gateway-api-crds/Chart.yaml | awk '{print $2}' | tr -d '"')"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::Chart.yaml version ${version} does not match appVersion ${tag}"
            exit 1
          fi
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" bash scripts/sync-gateway-api-crds.sh "${tag}"
          git diff --exit-code -- gateway-api-crds/templates

      - name: Every CRD carries the bundle version the chart names, and is kept on uninstall
        run: |
          set -euo pipefail
          tag="$(grep -E '^appVersion:' gateway-api-crds/Chart.yaml | awk '{print $2}' | tr -d '"')"
          helm template gateway-api-crds gateway-api-crds --kube-version 1.31.0 > /tmp/rendered.yaml
          python3 -m pip install --quiet pyyaml
          python3 - "${tag}" <<'CHECK'
          import sys
          import yaml

          tag = sys.argv[1]
          objects = [item for item in yaml.safe_load_all(open("/tmp/rendered.yaml")) if item]
          crds = [item for item in objects if item["kind"] == "CustomResourceDefinition"]
          if len(crds) != 8:
              raise SystemExit(f"expected 8 CRDs, rendered {len(crds)}")
          for item in objects:
              annotations = item["metadata"].get("annotations") or {}
              if annotations.get("helm.sh/resource-policy") != "keep":
                  raise SystemExit(f"{item['metadata']['name']} is not kept on uninstall")
          for item in crds:
              annotations = item["metadata"]["annotations"]
              if annotations.get("gateway.networking.k8s.io/bundle-version") != tag:
                  raise SystemExit(f"{item['metadata']['name']} is not at {tag}")
              if annotations.get("gateway.networking.k8s.io/channel") != "standard":
                  raise SystemExit(f"{item['metadata']['name']} is not the standard channel")
          print(f"{len(objects)} objects, {len(crds)} CRDs at {tag}, all kept on uninstall")
          CHECK

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.27.0

      - name: Install on a real cluster and check the release Secret size
        run: |
          set -euo pipefail
          helm install gateway-api-crds gateway-api-crds -n gateway-system --create-namespace --wait --timeout 3m
          kubectl get crd httproutes.gateway.networking.k8s.io gateways.gateway.networking.k8s.io gatewayclasses.gateway.networking.k8s.io
          size="$(kubectl get secret -n gateway-system sh.helm.release.v1.gateway-api-crds.v1 -o json \
            | python3 -c 'import base64,json,sys; print(len(base64.b64decode(json.load(sys.stdin)["data"]["release"])))')"
          echo "release Secret data: ${size} bytes (the API server refuses over 1048576)"
          if [[ "${size}" -gt 900000 ]]; then
            echo "::error::the release Secret is ${size} bytes, too close to the 1 MiB limit"
            exit 1
          fi

      - name: Uninstalling keeps the CRDs
        run: |
          set -euo pipefail
          helm uninstall gateway-api-crds -n gateway-system --wait --timeout 2m
          kubectl get crd httproutes.gateway.networking.k8s.io
