name: charts-hermes-sync

# Daily watch on the Hermes Agent image. Two things can change:
#
#   1. A newer CalVer tag is published upstream    -> appVersion moves.
#   2. The pinned tag resolves to a new digest     -> the tag was moved under
#      us. That is a supply-chain event, not a release, and the PR says so.
#
# Either way the chart version gets a patch bump so charts-publish has
# something new to push, and the change lands as a rolling PR rather than a
# direct commit to main.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pin a specific image tag (default: newest CalVer tag upstream)"
        type: string
        required: false

concurrency:
  group: charts-hermes-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CHART: hermes-agent
  HELM_VERSION: v3.14.0

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Record the current pin
        id: before
        run: |
          set -euo pipefail
          {
            echo "tag=$(yq -r '.image.tag' "${CHART}/values.yaml")"
            echo "digest=$(yq -r '.image.digest' "${CHART}/values.yaml")"
            echo "chart_version=$(yq -r '.version' "${CHART}/Chart.yaml")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the image digest
        id: sync
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          exit_code=0
          ./scripts/sync-image-digest.sh "${CHART}" "${INPUT_TAG}" || exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [[ "${exit_code}" != "0" && "${exit_code}" != "2" ]]; then
            exit "${exit_code}"
          fi

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Classify the change
        if: steps.changes.outputs.has_changes == 'true'
        id: classify
        run: |
          set -euo pipefail
          new_tag="$(yq -r '.image.tag' "${CHART}/values.yaml")"
          new_digest="$(yq -r '.image.digest' "${CHART}/values.yaml")"
          if [[ "${new_tag}" == "${{ steps.before.outputs.tag }}" ]]; then
            echo "kind=tag-moved" >> "$GITHUB_OUTPUT"
          else
            echo "kind=new-release" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${new_digest}" >> "$GITHUB_OUTPUT"

      - name: Bump the chart patch version
        if: steps.changes.outputs.has_changes == 'true'
        id: bump
        run: |
          set -euo pipefail
          current="${{ steps.before.outputs.chart_version }}"
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="${major}.${minor}.$((patch + 1))"
          python3 - "${CHART}/Chart.yaml" "${next}" <<'PYTHON'
          import re
          import sys

          chart_file, next_version = sys.argv[1], sys.argv[2]
          with open(chart_file, encoding="utf-8") as handle:
              content = handle.read()
          content, count = re.subn(r"(?m)^version:\s*.*$", f"version: {next_version}", content, count=1)
          if not count:
              raise SystemExit(f"{chart_file}: no version: line")
          with open(chart_file, "w", encoding="utf-8") as handle:
              handle.write(content)
          PYTHON
          echo "chart_version=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} -> ${next}"

      - name: Lint and test before proposing the bump
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.5.2
          helm lint --strict "${CHART}"
          helm template ci "${CHART}" --namespace hermes \
            --set secrets.existingSecret=hermes-credentials > /dev/null
          # The unit tests assert the pinned digest, so refresh them with the
          # new one rather than letting the PR land red.
          grep -rl "${{ steps.before.outputs.digest }}" "${CHART}/tests" \
            | xargs --no-run-if-empty sed -i \
              "s|${{ steps.before.outputs.tag }}@${{ steps.before.outputs.digest }}|${{ steps.classify.outputs.tag }}@${{ steps.classify.outputs.digest }}|g"
          helm unittest "${CHART}"

      - name: Compose the PR body
        if: steps.changes.outputs.has_changes == 'true'
        id: pr_body
        run: |
          set -euo pipefail
          {
            if [[ "${{ steps.classify.outputs.kind }}" == "tag-moved" ]]; then
              echo "## The pinned tag moved"
              echo
              echo "\`${{ steps.classify.outputs.tag }}\` now resolves to a different image."
              echo "The tag did not change, the contents did. **Review what changed upstream"
              echo "before merging** - this is the case digest pinning exists to catch."
            else
              echo "## New Hermes Agent release"
              echo
              echo "Upstream published \`${{ steps.classify.outputs.tag }}\`."
            fi
            echo
            echo "| | Before | After |"
            echo "|---|---|---|"
            echo "| Image tag | \`${{ steps.before.outputs.tag }}\` | \`${{ steps.classify.outputs.tag }}\` |"
            echo "| Image digest | \`${{ steps.before.outputs.digest }}\` | \`${{ steps.classify.outputs.digest }}\` |"
            echo "| Chart version | \`${{ steps.before.outputs.chart_version }}\` | \`${{ steps.bump.outputs.chart_version }}\` |"
            echo
            echo "Merging publishes \`hermes-agent-${{ steps.bump.outputs.chart_version }}\` to GHCR and the Pages Helm repo."
            echo
            echo "Generated by [\`charts-hermes-sync.yml\`](./.github/workflows/charts-hermes-sync.yml)."
          } > /tmp/pr-body.md
          labels="automated,dependencies,hermes-agent"
          if [[ "${{ steps.classify.outputs.kind }}" == "tag-moved" ]]; then
            labels="${labels},needs-review,security"
          fi
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

      - name: Create or update the PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(hermes-agent): pin ${{ steps.classify.outputs.tag }}

            Automated image digest sync produced by
            .github/workflows/charts-hermes-sync.yml.
          branch: chore/charts-hermes-sync
          delete-branch: true
          title: "chore(hermes-agent): pin ${{ steps.classify.outputs.tag }} (${{ steps.classify.outputs.kind }})"
          body-path: /tmp/pr-body.md
          labels: ${{ steps.pr_body.outputs.labels }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: No-op summary
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          {
            echo "### hermes-agent is up to date"
            echo
            echo "Pinned \`${{ steps.before.outputs.tag }}\` still resolves to \`${{ steps.before.outputs.digest }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
