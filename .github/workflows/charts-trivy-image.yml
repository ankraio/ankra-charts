name: charts-trivy-image

# Builds ghcr.io/ankraio/images/trivy from the upstream aquasec/trivy image
# pinned by digest in images/trivy/Dockerfile, with brotli-libs raised to the
# Alpine release that fixes CVE-2026-111497, and pushes a multi-arch
# (amd64/arm64), cosign-signed image.
#
# Like the UpCloud CCM build, upstream DOES publish its own image; this one
# exists only until an upstream Trivy release carries the fix, so the tag
# carries an `-ankra.N` suffix (<upstream tag>-<image-revision>) and must not
# be mistaken for stock upstream. When upstream catches up, delete this
# workflow and images/trivy, and point the security-baseline profile's
# trivy.image back at mirror.gcr.io/aquasec/trivy.
#
# A pull request builds and smoke-tests the image without pushing. A push to
# main publishes it, and refuses to overwrite a tag that already exists:
# consumers pin the tag AND the digest, so a changed image needs a new
# image-revision.
#
# Nothing picks a new image up on its own: the Ankra platform pins
# tag@digest in the security-baseline profile in ankraio/cluster
# (alembic/platform_profiles/security-baseline/trivy-operator.values.yaml),
# so an image change arrives as a reviewed cluster PR.
#
# Third-party actions are pinned by commit SHA - a tag can be moved.

on:
  push:
    branches: [main]
    paths:
      - "images/trivy/**"
      - ".github/workflows/charts-trivy-image.yml"
  pull_request:
    paths:
      - "images/trivy/**"
      - ".github/workflows/charts-trivy-image.yml"
  workflow_dispatch:

concurrency:
  group: charts-trivy-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/ankraio/images/trivy

jobs:
  build-push:
    name: build (and on main push) the Trivy image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Read the pinned upstream version
        id: version
        run: |
          set -euo pipefail
          upstream="$(sed -n 's|^ARG UPSTREAM_IMAGE=mirror\.gcr\.io/aquasec/trivy:\([0-9][0-9.]*\)@sha256:[0-9a-f]\{64\}$|\1|p' \
            images/trivy/Dockerfile | head -1)"
          revision="$(sed -n 's/^# image-revision: \(ankra\.[0-9][0-9]*\)$/\1/p' \
            images/trivy/Dockerfile | head -1)"
          if [[ -z "${upstream}" || -z "${revision}" ]]; then
            echo "::error::could not read UPSTREAM_IMAGE (tag@digest) or '# image-revision: ankra.N' from the Dockerfile"
            exit 1
          fi
          echo "tag=${upstream}-${revision}" >> "$GITHUB_OUTPUT"
          echo "building upstream ${upstream} as ${upstream}-${revision}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite a published version
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.version.outputs.tag }} already exists; bump '# image-revision' in the Dockerfile"
            exit 1
          fi

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/trivy
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: trivy-smoke:local

      # The image is Trivy, so it scans itself: that proves the binary still
      # runs and can pull a database and scan an image, and it fails the
      # build on any CRITICAL in an OS package that has a fix - which this
      # image exists to carry, and which the same version floor would clear.
      # Findings in the Trivy binary itself are upstream's to fix and are
      # reported, not gated.
      - name: Smoke-test the image (version, package floor, self-scan)
        run: |
          set -euo pipefail
          docker run --rm trivy-smoke:local --version
          docker run --rm --entrypoint apk trivy-smoke:local info -v 2>/dev/null | grep '^brotli-libs-'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock trivy-smoke:local \
            image --scanners vuln --pkg-types os --severity CRITICAL --ignore-unfixed \
            --exit-code 1 trivy-smoke:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock trivy-smoke:local \
            image --scanners vuln --severity CRITICAL,HIGH trivy-smoke:local

      - name: Build (amd64 + arm64), push on main
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/trivy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the pushed image (keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${{ steps.push.outputs.digest }}"

      # Every cluster pulls this image anonymously, and a new GHCR package
      # starts private: a pinned image nobody can pull fails every scan job.
      - name: Check that the image is publicly pullable
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "${IMAGE}:${{ steps.version.outputs.tag }} is publicly pullable"
          else
            echo "::warning::${IMAGE} is not publicly pullable; set the package's visibility to public before any cluster pins it"
          fi

      - name: What to do next
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "pushed  ${IMAGE}:${{ steps.version.outputs.tag }}"
          echo "digest  ${{ steps.push.outputs.digest }}"
          echo
          echo "Pin trivy.image (registry ghcr.io, repository ankraio/images/trivy,"
          echo "tag ${{ steps.version.outputs.tag }}@${{ steps.push.outputs.digest }})"
          echo "in the security-baseline profile in ankraio/cluster, through a"
          echo "platprof reseed migration."
