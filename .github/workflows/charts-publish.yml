name: charts-publish

# Package Helm charts and push them to GHCR as OCI artifacts.
#
# Published as:
#   oci://ghcr.io/ankraio/ankra-charts/<chart>:<version>
#
# Each chart is published independently; pushing the same chart+version twice
# is treated as a no-op (the step checks GHCR before packaging). Chart
# directories are discovered automatically via scripts/discover-charts.sh.
#
# Every pushed artifact is signed with cosign (keyless, GitHub OIDC) and carries
# an SPDX SBOM attestation, so consumers can prove a chart came from this
# repository's workflow. Verification instructions are in README.md.

on:
  push:
    branches: [main]
    paths:
      - "*/Chart.yaml"
      - "*/values.yaml"
      - "*/templates/**"
      - "scripts/discover-charts.sh"
      - ".github/workflows/charts-publish.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-push even if the version already exists in GHCR"
        type: boolean
        default: false

concurrency:
  group: charts-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless cosign signing needs a workload identity token.
  id-token: write

env:
  OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/ankra-charts

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.discover.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          set -euo pipefail
          charts_json="$(bash scripts/discover-charts.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          if [[ "${charts_json}" == "[]" ]]; then
            echo "No chart directories found." >&2
            exit 1
          fi
          echo "charts=${charts_json}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish ${{ matrix.chart }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Read chart metadata
        id: meta
        run: |
          set -euo pipefail
          chart="${{ matrix.chart }}"
          version="$(grep -E '^version:' "${chart}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          name="$(grep -E '^name:' "${chart}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          echo "chart_name=${name}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${version}" >> "$GITHUB_OUTPUT"
          echo "oci_ref=oci://${OCI_REGISTRY}/${name}:${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${chart} -> ${name}:${version}"

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Check if version already exists
        id: exists
        run: |
          set -euo pipefail
          name="${{ steps.meta.outputs.chart_name }}"
          version="${{ steps.meta.outputs.chart_version }}"
          force="${{ github.event.inputs.force || 'false' }}"
          if [[ "${force}" == "true" ]]; then
            echo "force=true; will push regardless"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if helm show chart "oci://${OCI_REGISTRY}/${name}" --version "${version}" \
               > /dev/null 2>&1; then
            echo "::notice::${name}:${version} already published; skipping. Bump version: in Chart.yaml to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${name}:${version} not yet published; proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: helm lint
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          case "${{ matrix.chart }}" in
            upcloud-ccm)
              helm lint "${{ matrix.chart }}" \
                --set ccmConfig.clusterID=ci-test \
                --set credentials.username=ci \
                --set credentials.password=ci
              ;;
            psono)
              helm lint "${{ matrix.chart }}" \
                --set base_url=https://psono.example.com \
                --set domain=example.com
              ;;
            *)
              helm lint "${{ matrix.chart }}"
              ;;
          esac

      - name: Install cosign
        if: steps.exists.outputs.skip == 'false'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Package and push to GHCR (OCI)
        id: push
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p /tmp/packages
          pkg="$(helm package "${{ matrix.chart }}" --destination /tmp/packages \
                  | awk '{print $NF}')"
          echo "Packaged ${pkg}"
          helm push "${pkg}" "oci://${OCI_REGISTRY}" 2>&1 | tee /tmp/helm-push.log
          digest="$(awk '/^Digest:/ {print $2}' /tmp/helm-push.log)"
          if [[ -z "${digest}" ]]; then
            echo "::error::helm push did not report a digest; refusing to sign an unknown artifact"
            exit 1
          fi
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "signing_ref=${OCI_REGISTRY}/${{ steps.meta.outputs.chart_name }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate an SBOM for the chart
        if: steps.exists.outputs.skip == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ matrix.chart }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign and attest the pushed chart
        if: steps.exists.outputs.skip == 'false'
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # `helm registry login` writes to Helm's own credentials file, which
          # cosign does not read. Log cosign in separately.
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          cosign sign "${{ steps.push.outputs.signing_ref }}"
          cosign attest \
            --type spdxjson \
            --predicate /tmp/sbom.spdx.json \
            "${{ steps.push.outputs.signing_ref }}"

      - name: Verify what we just published
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.push.outputs.signing_ref }}" > /dev/null
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.push.outputs.signing_ref }}" > /dev/null
          echo "signature and SBOM attestation verified"

      - name: Summary
        if: always()
        run: |
          {
            echo "### \`${{ steps.meta.outputs.chart_name }}\` @ \`${{ steps.meta.outputs.chart_version }}\`"
            echo
            if [[ "${{ steps.exists.outputs.skip }}" == "true" ]]; then
              echo "Already published - skipped."
            else
              echo "Published \`${{ steps.meta.outputs.oci_ref }}\` (\`${{ steps.push.outputs.digest }}\`), signed and attested."
              echo
              echo '```bash'
              echo "helm install ${{ steps.meta.outputs.chart_name }} \\"
              echo "  ${{ steps.meta.outputs.oci_ref }} \\"
              echo "  --version ${{ steps.meta.outputs.chart_version }}"
              echo '```'
              echo
              echo "Verify:"
              echo
              echo '```bash'
              echo "cosign verify ${{ steps.push.outputs.signing_ref }} \\"
              echo "  --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/' \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
