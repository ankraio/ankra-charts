name: charts-smoke

# The checks that have to start a container, which an Ankra Pipelines step
# cannot do (kind needs Docker and a privileged runner). Everything else these
# charts are gated on - lint, render, kubeconform, unittest, guardrails, Trivy,
# the pinned digest and the helm install --dry-run=server matrix - runs on Ankra
# Pipelines (.ankra/pipeline.yaml). Each job is a real install on kind that
# waits for Ready.
#
# Third-party actions are pinned by commit SHA - a tag can be moved.

on:
  pull_request:
    paths:
      - "hermes-agent/**"
      - "isms-builder/**"
      - "claude-code-openai-wrapper/**"
      - "images/claude-code-openai-wrapper/**"
      - "cloudflare-operator/**"
      - ".github/workflows/charts-smoke.yml"
  push:
    branches: [main]
    paths:
      - "hermes-agent/**"
      - "isms-builder/**"
      - "claude-code-openai-wrapper/**"
      - "images/claude-code-openai-wrapper/**"
      - "cloudflare-operator/**"
      - ".github/workflows/charts-smoke.yml"
  workflow_dispatch:

concurrency:
  group: charts-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: which charts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hermes-agent: ${{ steps.filter.outputs.hermes-agent }}
      isms-builder: ${{ steps.filter.outputs.isms-builder }}
      claude-code-openai-wrapper: ${{ steps.filter.outputs.claude-code-openai-wrapper }}
      cloudflare-operator: ${{ steps.filter.outputs.cloudflare-operator }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed() {
            if [[ "${EVENT_NAME}" == "workflow_dispatch" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
              echo true
            elif git diff --name-only "${BASE_SHA}" HEAD | grep -qE "$1"; then
              echo true
            else
              echo false
            fi
          }
          workflow='^\.github/workflows/charts-smoke\.yml$'
          {
            echo "hermes-agent=$(changed "^hermes-agent/|${workflow}")"
            echo "isms-builder=$(changed "^isms-builder/|${workflow}")"
            echo "claude-code-openai-wrapper=$(changed "^(claude-code-openai-wrapper|images/claude-code-openai-wrapper)/|${workflow}")"
            echo "cloudflare-operator=$(changed "^cloudflare-operator/|${workflow}")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  hermes-agent:
    needs: changes
    if: needs.changes.outputs.hermes-agent == 'true'
    # The gate that was missing when 0.1.0 shipped a chart that could not boot.
    # --dry-run=server validates manifests against the apiserver but never runs
    # the image, so a securityContext the image rejects passed every check.
    # This actually starts the container and waits for Ready.
    name: hermes-agent kind smoke test (real install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          node_image: "kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87"
          cluster_name: smoke

      - name: Namespace and a stand-in Secret
        run: |
          set -euo pipefail
          kubectl create namespace hermes
          # PodSecurity baseline, not restricted: the image enters as root.
          kubectl label namespace hermes \
            pod-security.kubernetes.io/enforce=baseline \
            pod-security.kubernetes.io/warn=baseline
          kubectl -n hermes create secret generic hermes-credentials \
            --from-literal=OPENAI_API_KEY=ci-placeholder \
            --from-literal=OPENAI_BASE_URL=https://example.invalid/v1

      - name: helm install --wait
        run: |
          set -euo pipefail
          # No PVC: kind has no default RWO provisioner worth waiting on here,
          # and the bootstrap path this test exercises is identical.
          helm install hermes hermes-agent \
            --namespace hermes \
            --set secrets.existingSecret=hermes-credentials \
            --set persistence.enabled=false \
            --wait --timeout 10m

      - name: The pod must be Running, not restarting
        run: |
          set -euo pipefail
          kubectl -n hermes get pods -o wide
          kubectl -n hermes wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=hermes-agent --timeout=300s
          restarts="$(kubectl -n hermes get pods \
            -l app.kubernetes.io/name=hermes-agent \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')"
          echo "restartCount=${restarts}"
          if [[ "${restarts}" != "0" ]]; then
            echo "::error::the container restarted ${restarts} time(s); it is not starting cleanly"
            kubectl -n hermes logs -l app.kubernetes.io/name=hermes-agent --tail=100 --previous || true
            exit 1
          fi

      - name: The agent process must not be root
        run: |
          # No `set -e`: the probe is expected to come back empty while
          # s6-overlay is still bringing the service up, and aborting on the
          # first miss is what made this step fail on a pod that was fine.
          set -uo pipefail
          pod="$(kubectl -n hermes get pods -l app.kubernetes.io/name=hermes-agent -o name | head -1)"
          # Not `id -u`: kubectl exec starts a new process as the container
          # user, which is root here. s6-overlay supervises as root and drops
          # only its services, so the hermes process itself has to be inspected.
          probe='
            for entry in /proc/[0-9]*; do
              [ "$(cat "$entry/comm" 2>/dev/null)" = "hermes" ] || continue
              sed -n "s/^Uid:[[:space:]]*\([0-9]*\).*/\1/p" "$entry/status"
              exit 0
            done
            exit 1
          '
          # Ready only means the container started: the chart configures no
          # readiness probe unless apiServer is enabled, so the supervised
          # hermes service can still be a few seconds behind.
          uid=""
          for _ in $(seq 1 24); do
            uid="$(kubectl -n hermes exec "${pod}" -c hermes-agent -- sh -c "${probe}" 2>/dev/null)"
            if [[ -n "${uid}" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "${uid}" ]]; then
            echo "::error::no hermes process appeared within 120s"
            kubectl -n hermes exec "${pod}" -c hermes-agent -- ps -eo user,uid,pid,comm || true
            exit 1
          fi
          echo "hermes process uid=${uid}"
          if [[ "${uid}" == "0" ]]; then
            echo "::error::the hermes process is running as root; HERMES_UID did not take effect"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n hermes describe pods || true
          kubectl -n hermes logs -l app.kubernetes.io/name=hermes-agent --tail=200 || true

  isms-builder:
    needs: changes
    if: needs.changes.outputs.isms-builder == 'true'
    # --dry-run=server validates manifests against the apiserver but never runs
    # the image; this actually starts the container and waits for Ready, which
    # also exercises the probes, the PersistentVolumeClaim and the fsGroup
    # ownership of the data volume.
    name: isms-builder kind smoke test (real install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          node_image: "kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87"
          cluster_name: smoke

      - name: Namespace and a stand-in Secret
        run: |
          set -euo pipefail
          kubectl create namespace isms
          # The chart's defaults satisfy the PodSecurity "restricted" profile.
          kubectl label namespace isms \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/warn=restricted
          kubectl -n isms create secret generic isms-credentials \
            --from-literal=JWT_SECRET=ci-smoke-secret-not-for-production

      - name: helm install --wait
        run: |
          set -euo pipefail
          helm install isms isms-builder \
            --namespace isms \
            --set secrets.existingSecret=isms-credentials \
            --wait --timeout 10m

      - name: The pod must be Ready, not restarting, and the isms user
        run: |
          set -euo pipefail
          kubectl -n isms get pods -o wide
          kubectl -n isms get pvc
          kubectl -n isms wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=isms-builder --timeout=300s
          restarts="$(kubectl -n isms get pods \
            -l app.kubernetes.io/name=isms-builder \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')"
          echo "restartCount=${restarts}"
          if [[ "${restarts}" != "0" ]]; then
            echo "::error::the container restarted ${restarts} time(s); it is not starting cleanly"
            kubectl -n isms logs -l app.kubernetes.io/name=isms-builder --tail=100 --previous || true
            exit 1
          fi
          pod="$(kubectl -n isms get pods -l app.kubernetes.io/name=isms-builder -o name | head -1)"
          uid="$(kubectl -n isms exec "${pod}" -c isms-builder -- id -u)"
          echo "container uid=${uid}"
          if [[ "${uid}" != "100" ]]; then
            echo "::error::expected the image's fixed isms uid 100, got ${uid}"
            exit 1
          fi

      - name: /api/version and the login page must answer through the Service
        run: |
          set -euo pipefail
          kubectl -n isms run api-probe --rm -i --restart=Never \
            --image=ghcr.io/coolstartnow/isms-builder:1.40.2 \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":100,"runAsGroup":101,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"api-probe","image":"ghcr.io/coolstartnow/isms-builder:1.40.2","command":["node","-e","const http=require(\"http\");const base=\"http://isms-isms-builder.isms.svc:3000\";function get(path){return new Promise((resolve,reject)=>{http.get(base+path,(response)=>{let body=\"\";response.on(\"data\",(chunk)=>body+=chunk);response.on(\"end\",()=>resolve({status:response.statusCode,body}));}).on(\"error\",reject);});}(async()=>{const version=await get(\"/api/version\");console.log(\"/api/version\",version.status,version.body);if(version.status!==200||!JSON.parse(version.body).version)process.exit(1);const login=await get(\"/ui/login.html\");console.log(\"/ui/login.html\",login.status,login.body.length,\"bytes\");if(login.status!==200)process.exit(1);})().catch((error)=>{console.error(error);process.exit(1);});"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true}}]}}'

      - name: Data must survive a pod restart
        run: |
          set -euo pipefail
          pod="$(kubectl -n isms get pods -l app.kubernetes.io/name=isms-builder -o name | head -1)"
          kubectl -n isms exec "${pod}" -c isms-builder -- ls /app/data
          kubectl -n isms delete "${pod}" --wait
          kubectl -n isms wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=isms-builder --timeout=300s
          pod="$(kubectl -n isms get pods -l app.kubernetes.io/name=isms-builder -o name | head -1)"
          # The seeded stores were created by the first pod and must still be
          # there for the second one.
          kubectl -n isms exec "${pod}" -c isms-builder -- test -f /app/data/rbac_users.json
          echo "data volume survived the restart"

      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n isms describe pods || true
          kubectl -n isms logs -l app.kubernetes.io/name=isms-builder --tail=200 || true

  claude-code-openai-wrapper:
    needs: changes
    if: needs.changes.outputs.claude-code-openai-wrapper == 'true'
    # --dry-run=server validates manifests against the apiserver but never runs
    # the image; this actually starts the container and waits for Ready, which
    # also exercises the /health probes. The pull goes through a token-backed
    # pull Secret so it works before the GHCR package is public.
    name: claude-code-openai-wrapper kind smoke test (real install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          node_image: "kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87"
          cluster_name: smoke

      - name: Namespace and a stand-in Secret
        run: |
          set -euo pipefail
          kubectl create namespace claude
          # The chart's defaults satisfy the PodSecurity "restricted" profile.
          kubectl label namespace claude \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/warn=restricted
          kubectl -n claude create secret generic claude-credentials \
            --from-literal=ANTHROPIC_API_KEY=ci-placeholder \
            --from-literal=API_KEY=ci-token

      - name: helm install --wait
        run: |
          set -euo pipefail
          helm install claude-wrapper claude-code-openai-wrapper \
            --namespace claude \
            --set secrets.existingSecret=claude-credentials \
            --wait --timeout 10m

      - name: The pod must be Ready, not restarting, and non-root
        run: |
          set -euo pipefail
          kubectl -n claude get pods -o wide
          kubectl -n claude wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=claude-code-openai-wrapper --timeout=300s
          restarts="$(kubectl -n claude get pods \
            -l app.kubernetes.io/name=claude-code-openai-wrapper \
            -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')"
          echo "restartCount=${restarts}"
          if [[ "${restarts}" != "0" ]]; then
            echo "::error::the container restarted ${restarts} time(s); it is not starting cleanly"
            kubectl -n claude logs -l app.kubernetes.io/name=claude-code-openai-wrapper --tail=100 --previous || true
            exit 1
          fi
          pod="$(kubectl -n claude get pods -l app.kubernetes.io/name=claude-code-openai-wrapper -o name | head -1)"
          uid="$(kubectl -n claude exec "${pod}" -c claude-code-openai-wrapper -- id -u)"
          echo "container uid=${uid}"
          if [[ "${uid}" != "10001" ]]; then
            echo "::error::expected the fixed non-root uid 10001, got ${uid}"
            exit 1
          fi

      - name: /health and /v1/models must answer through the Service
        run: |
          set -euo pipefail
          kubectl -n claude run api-probe --rm -i --restart=Never \
            --image=ghcr.io/ankraio/images/claude-code-openai-wrapper:v2.3.0 \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":10001,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"api-probe","image":"ghcr.io/ankraio/images/claude-code-openai-wrapper:v2.3.0","command":["python","-c","import json,urllib.request;base=\"http://claude-wrapper-claude-code-openai-wrapper.claude.svc:8000\";health=json.load(urllib.request.urlopen(base+\"/health\",timeout=10));print(health);assert health[\"status\"]==\"healthy\";request=urllib.request.Request(base+\"/v1/models\",headers={\"Authorization\":\"Bearer ci-token\"});models=json.load(urllib.request.urlopen(request,timeout=10));print([m[\"id\"] for m in models[\"data\"]][:3]);assert models[\"data\"]"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true}}]}}'

      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n claude describe pods || true
          kubectl -n claude logs -l app.kubernetes.io/name=claude-code-openai-wrapper --tail=200 || true

  cloudflare-operator:
    needs: changes
    if: needs.changes.outputs.cloudflare-operator == 'true'
    name: cloudflare-operator ct install on kind ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned `kindest/node` images per K8s minor; bump in lockstep with
        # `kubeVersion` in each chart's Chart.yaml.
        include:
          - k8s: "1.27"
            node: "kindest/node:v1.27.16@sha256:2d21a61643eafc439905e18705b8186f3296384750a835ad7a005dceb9546d20"
          - k8s: "1.29"
            node: "kindest/node:v1.29.14@sha256:8703bd94ee24e51b778d5556ae310c6c0fa67d761fae6379c8e0bb480e6fea29"
          - k8s: "1.31"
            node: "kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Create Kind cluster (${{ matrix.k8s }})
        uses: helm/kind-action@v1.10.0
        with:
          node_image: ${{ matrix.node }}
          cluster_name: cloudflare-operator-ct

      - name: Install cert-manager (dependency of the chart)
        run: |
          set -euo pipefail
          CM_VERSION=v1.16.2
          kubectl apply --server-side --force-conflicts \
            -f "https://github.com/cert-manager/cert-manager/releases/download/${CM_VERSION}/cert-manager.yaml"
          kubectl wait --for=condition=Established --timeout=120s \
            crd/certificates.cert-manager.io \
            crd/issuers.cert-manager.io \
            crd/clusterissuers.cert-manager.io
          kubectl -n cert-manager rollout status deploy/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          kubectl wait --for=condition=Available --timeout=120s \
            -n cert-manager deploy/cert-manager-webhook

      - name: ct install (cloudflare-operator)
        run: |
          set -euo pipefail
          kubectl create namespace cloudflare-operator-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n cloudflare-operator-system create secret generic cloudflare-secrets \
            --from-literal=CLOUDFLARE_API_TOKEN=ci-placeholder \
            --from-literal=CLOUDFLARE_ACCOUNT_ID=ci-placeholder \
            --dry-run=client -o yaml | kubectl apply -f -
          ct install \
            --charts cloudflare-operator \
            --namespace cloudflare-operator-system \
            --helm-extra-args "--timeout 5m" \
            --helm-extra-set-args "--set replicaCount=1 --set podDisruptionBudget.enabled=false --set networkPolicy.enabled=false"
