name: charts-external-dns-webhook-proxy-image

# Builds ghcr.io/ankraio/images/external-dns-webhook-proxy from
# images/external-dns-webhook-proxy and pushes a multi-arch (amd64/arm64),
# cosign-signed image. The source lives here; there is no upstream.
#
# The tag is the `# image-version:` line in the Dockerfile. A push that does
# not bump it fails rather than silently replacing an image consumers already
# pin by digest.
#
# Nothing picks a new image up on its own: the Ankra platform pins
# tag@digest in cluster scheduler/go/internal/cloudprovstack
# (ExternalDNSWebhookProxyImage), so an image change arrives as a reviewed
# cluster PR.
#
# Third-party actions are pinned by commit SHA - a tag can be moved.

on:
  push:
    branches: [main]
    paths:
      - "images/external-dns-webhook-proxy/**"
      - ".github/workflows/charts-external-dns-webhook-proxy-image.yml"
  pull_request:
    paths:
      - "images/external-dns-webhook-proxy/**"
      - ".github/workflows/charts-external-dns-webhook-proxy-image.yml"
  workflow_dispatch:

concurrency:
  group: charts-external-dns-webhook-proxy-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/ankraio/images/external-dns-webhook-proxy

jobs:
  build-push:
    name: build (and on main push) the webhook proxy image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Read the image version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^# image-version: \(v[0-9][0-9.]*\)$/\1/p' \
            images/external-dns-webhook-proxy/Dockerfile | head -1)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not read '# image-version: vX.Y.Z' from the Dockerfile"
            exit 1
          fi
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "image version ${version}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite a published version
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${{ steps.version.outputs.tag }} already exists; bump '# image-version' in the Dockerfile"
            exit 1
          fi

      # The Dockerfile runs go vet and the tests, so a change that lets the
      # credential reach a log line fails here, on the PR, before it can ship.
      - name: Build (amd64 + arm64), push on main
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/external-dns-webhook-proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the pushed image (keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: What to do next
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "pushed  ${IMAGE}:${{ steps.version.outputs.tag }}"
          echo "digest  ${{ steps.push.outputs.digest }}"
          echo
          echo "Pin ${IMAGE}:${{ steps.version.outputs.tag }}@${{ steps.push.outputs.digest }}"
          echo "as ExternalDNSWebhookProxyImage in the cluster repo's cloudprovstack."
