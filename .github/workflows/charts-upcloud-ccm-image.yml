name: charts-upcloud-ccm-image

# Builds ghcr.io/ankraio/images/upcloud-cloud-controller-manager from the
# upstream ref pinned in images/upcloud-ccm/Dockerfile, with the patches in
# images/upcloud-ccm/patches applied, and pushes a multi-arch (amd64/arm64),
# cosign-signed image.
#
# Unlike the other image build in this repository, upstream DOES publish its
# own image (ghcr.io/upcloudltd/cloud-controller-manager). This build exists
# only to carry a patch until it is released upstream, so the tag carries an
# `-ankra.N` suffix: it is not stock upstream and must not be mistaken for it.
# When the patch lands upstream, delete this workflow, images/upcloud-ccm,
# and point the chart's images.ccm back at the upstream repository.
#
# The chart does not pick this image up on its own - upcloud-ccm's values
# default to the upstream image, and a consumer opts in by setting
# images.ccm.{registry,repository,tag} and clearing images.ccm.digest. Note
# that scripts/sync-image-digest.sh does not handle this chart: it reads
# .image.*, while upcloud-ccm nests its images under .images.ccm.*.
#
# Third-party actions are pinned by commit SHA - a tag can be moved.

on:
  push:
    branches: [main]
    paths:
      - "images/upcloud-ccm/**"
      - ".github/workflows/charts-upcloud-ccm-image.yml"
  workflow_dispatch:

concurrency:
  group: charts-upcloud-ccm-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/ankraio/images/upcloud-cloud-controller-manager

jobs:
  build-push:
    name: build and push the patched CCM image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Read the pinned upstream version
        id: upstream
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^ARG UPSTREAM_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' \
            images/upcloud-ccm/Dockerfile | head -1)"
          tag="$(sed -n 's/^# \(v[0-9.]*\) - the commit is what gets fetched.*$/\1/p' \
            images/upcloud-ccm/Dockerfile | head -1)"
          revision="$(sed -n 's/^# image-revision: \(.*\)$/\1/p' \
            images/upcloud-ccm/Dockerfile | head -1)"
          if [[ -z "${commit}" || -z "${tag}" || -z "${revision}" ]]; then
            echo "::error::could not read UPSTREAM_COMMIT, its tag comment, or image-revision from the Dockerfile"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}-${revision}" >> "$GITHUB_OUTPUT"
          echo "building upstream ${tag} (${commit}) as ${tag}-${revision}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The Dockerfile runs the upstream unit tests, including the ones the
      # patch adds, so a patch that stopped applying cleanly or regressed the
      # default behaviour fails the build rather than shipping.
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/upcloud-ccm
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.upstream.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the pushed image (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: What to do next
        run: |
          set -euo pipefail
          echo "pushed  ${IMAGE}:${{ steps.upstream.outputs.tag }}"
          echo "digest  ${{ steps.push.outputs.digest }}"
          echo
          echo "Nothing consumes this image until a consumer pins it. For the"
          echo "Ankra platform that is cloudprovstack.BuildUpcloudStack, which"
          echo "sets images.ccm.{registry,repository,digest} on overlay"
          echo "clusters - update UpcloudCCMPatchedImageDigest there."
