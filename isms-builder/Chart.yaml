  artifacthub.io/changes: |
    - kind: added
      description: "Initial chart: upstream publishes a container image but no Helm chart, so this one wraps it - digest-pinned image, restricted-PodSecurity defaults (the image's fixed isms user, root entrypoint bypassed), a PersistentVolumeClaim for /app/data, JWT_SECRET through a managed Secret or ExternalSecret, json/sqlite/postgres/mariadb storage backends, and a same-namespace-only NetworkPolicy."
