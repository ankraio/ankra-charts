suite: secret handling
templates:
  - templates/secret.yaml
  - templates/external-secret.yaml
release:
  name: ut
  namespace: isms
tests:
  - it: renders no Secret when an existing one is referenced
    set:
      secrets.existingSecret: isms-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: renders waived inline secrets into a generated Secret
    template: templates/secret.yaml
    set:
      hardening.allowInlineSecrets: true
      secrets.JWT_SECRET: ci-placeholder
      secrets.DB_PASS: ci-db-pass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ut-isms-builder-secrets
      - equal:
          path: stringData.JWT_SECRET
          value: ci-placeholder
      - equal:
          path: stringData.DB_PASS
          value: ci-db-pass

  - it: renders an ExternalSecret targeting the consumed Secret name
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom:
        - extract:
            key: platform/isms-builder
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.secretStoreRef.name
          value: vault
      - equal:
          path: spec.target.name
          value: ut-isms-builder-secrets
