{{- include "isms-builder.validate" . -}}
{{- if and (not .Values.externalSecret.enabled) (not .Values.secrets.existingSecret) }}
{{- $inlineSecretKeys := include "isms-builder.inlineSecretKeys" . | fromJsonArray -}}
{{- if gt (len $inlineSecretKeys) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "isms-builder.secretName" . }}
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key := $inlineSecretKeys }}
  {{ $key }}: {{ index $.Values.secrets $key | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
