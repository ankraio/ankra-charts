{{- include "isms-builder.validate" . -}}
{{- $image := include "isms-builder.image" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isms-builder.fullname" . }}
  labels:
    {{- include "isms-builder.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "isms-builder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "isms-builder.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.externalSecret.enabled (not .Values.secrets.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if .Values.externalSecret.enabled }}
        checksum/external-secret: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        {{- else if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "isms-builder.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- if not (kindIs "invalid" .Values.hostUsers) }}
      hostUsers: {{ .Values.hostUsers }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: isms-builder
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's entrypoint starts as root, chowns a bind-mounted data
          # directory and drops to the isms user via su-exec - a docker-compose
          # convenience this chart has no use for: fsGroup already owns the
          # volume, so the server starts directly as the isms user and the pod
          # never runs as root. The server creates its own data subdirectories.
          command:
            - node
            - server/index.js
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: JWT_EXPIRES_IN
              value: {{ .Values.server.jwtExpiresIn | quote }}
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            {{- if include "isms-builder.usesSqlDatabase" . }}
            - name: DB_HOST
              value: {{ .Values.storage.database.host | quote }}
            {{- with .Values.storage.database.port }}
            - name: DB_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: DB_NAME
              value: {{ .Values.storage.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.storage.database.user | quote }}
            {{- if .Values.storage.database.ssl }}
            - name: DB_SSL
              value: "true"
            {{- end }}
            {{- end }}
            {{- with .Values.server.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.trustProxy }}
            - name: TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_SECURE
              value: {{ .Values.smtp.secure | toString | quote }}
            {{- with .Values.smtp.from }}
            - name: SMTP_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.smtp.user }}
            - name: SMTP_USER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ printf "%v" $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "isms-builder.secretName" . }}
                optional: {{ not (include "isms-builder.secretManagedExternally" .) }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port | int }}
              protocol: TCP
          {{- if .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- if .Values.probes.startup }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          {{- else }}
          # With a SQL backend the server exits until the database accepts
          # connections and relies on being restarted, so the startup window
          # stays generous.
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            failureThreshold: 24
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # Some upload paths resolve relative to the application directory,
            # so the data volume must sit exactly at /app/data.
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "isms-builder.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.writableVolumes.tmp.sizeLimit | quote }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
