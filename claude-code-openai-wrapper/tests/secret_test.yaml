suite: secret handling
templates:
  - templates/secret.yaml
  - templates/external-secret.yaml
release:
  name: ut
  namespace: claude
tests:
  - it: renders no Secret when one is brought along
    template: templates/secret.yaml
    set:
      secrets.existingSecret: claude-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the waived inline keys into a Secret
    template: templates/secret.yaml
    set:
      hardening.allowInlineSecrets: true
      secrets.ANTHROPIC_API_KEY: ci-placeholder
      secrets.API_KEY: ci-token
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.ANTHROPIC_API_KEY
          value: ci-placeholder
      - equal:
          path: stringData.API_KEY
          value: ci-token

  - it: renders an ExternalSecret and no inline Secret
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom:
        - extract:
            key: platform/claude-code-openai-wrapper
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - hasDocuments:
          count: 1
        template: templates/external-secret.yaml
      - equal:
          path: spec.secretStoreRef.name
          value: vault
        template: templates/external-secret.yaml
      - equal:
          path: spec.target.name
          value: ut-claude-code-openai-wrapper-secrets
        template: templates/external-secret.yaml

  - it: omits empty template metadata, which ESO rejects as null
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
    asserts:
      - notExists:
          path: spec.target.template.metadata

  - it: carries template metadata through when set
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.target.template.metadata.labels.team: platform
    asserts:
      - equal:
          path: spec.target.template.metadata.labels.team
          value: platform
