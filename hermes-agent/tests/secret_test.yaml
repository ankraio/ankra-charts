suite: secrets
templates:
  - templates/secret.yaml
  - templates/external-secret.yaml
release:
  name: ut
  namespace: hermes
tests:
  - it: creates no Secret when there is nothing to put in it
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no Secret when an existing one is referenced
    template: templates/secret.yaml
    set:
      secrets.existingSecret: hermes-credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: writes waived inline keys verbatim, without templating them
    template: templates/secret.yaml
    set:
      hardening.allowInlineSecrets: true
      secrets.OPENROUTER_API_KEY: "ci-placeholder-{{ .Release.Name }}"
      secrets.EXA_API_KEY: ci-token
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: ut-hermes-agent-secrets
      - equal:
          path: stringData.OPENROUTER_API_KEY
          value: "ci-placeholder-{{ .Release.Name }}"
      - equal:
          path: stringData.EXA_API_KEY
          value: ci-token

  - it: never treats the reserved keys as secret data
    template: templates/secret.yaml
    set:
      hardening.allowInlineSecrets: true
      secrets.EXA_API_KEY: ci-token
      secrets.annotations:
        example.com/rotated: "2026-08-16"
    asserts:
      - notExists:
          path: stringData.existingSecret
      - notExists:
          path: stringData.annotations
      - equal:
          path: metadata.annotations["example.com/rotated"]
          value: "2026-08-16"

  - it: renders an ExternalSecret against the current API version
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom:
        - extract:
            key: platform/hermes
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: spec.secretStoreRef.name
          value: vault
      - equal:
          path: spec.target.name
          value: ut-hermes-agent-secrets
      - equal:
          path: spec.target.deletionPolicy
          value: Retain

  - it: omits target.template.metadata when it would be empty
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
    asserts:
      # An empty mapping renders as `metadata: null`, which the ExternalSecret
      # CRD schema rejects.
      - notExists:
          path: spec.target.template.metadata

  - it: keeps target.template.metadata when there is something in it
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.target.template.metadata.labels:
        app.kubernetes.io/part-of: hermes-agent
    asserts:
      - equal:
          path: spec.target.template.metadata.labels["app.kubernetes.io/part-of"]
          value: hermes-agent

  - it: can pin the ExternalSecret to the legacy API version
    template: templates/external-secret.yaml
    set:
      externalSecret.enabled: true
      externalSecret.apiVersion: external-secrets.io/v1beta1
      externalSecret.secretStoreRef.name: vault
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1beta1
