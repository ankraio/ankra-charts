suite: deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
  - templates/pvc.yaml
release:
  name: ut
  namespace: hermes
tests:
  - it: pins the image by digest and keeps the tag for readability
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/nousresearch/hermes-agent:v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/nousresearch/hermes-agent:v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf

  - it: honours a private registry mirror
    template: templates/deployment.yaml
    set:
      image.registry: harbor.internal
      image.repository: mirror/hermes-agent
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^harbor\\.internal/mirror/hermes-agent:"

  - it: drops to a non-root uid the way the image supports
    template: templates/deployment.yaml
    asserts:
      # The image enters as root and remaps its own user, so no UID is pinned;
      # HERMES_UID is what it drops to.
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot
      # 10000 is the image's native hermes uid. Asking for anything else means
      # rewriting /etc/passwd, which readOnlyRootFilesystem forbids, so the
      # remap would silently no-op and leave fsGroup disagreeing with the uid
      # that actually owns the volume.
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HERMES_UID
            value: "10000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HERMES_GID
            value: "10000"

  - it: hands the data volume to the agent before it starts
    template: templates/deployment.yaml
    asserts:
      # fsGroup sets the volume's group but not its owner, and the image only
      # chowns what it creates, so a pre-existing volume root stays root-owned.
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'chown -R "\$\{HERMES_UID\}:\$\{HERMES_GID\}"'
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: HERMES_UID
            value: "10000"

  - it: keeps the root filesystem read-only with a writable /run for s6-overlay
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      # s6-overlay cannot hand the agent to HERMES_UID without these; anything
      # beyond them is refused by the hardening guard.
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - CHOWN
            - DAC_OVERRIDE
            - SETGID
            - SETUID
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: run
            mountPath: /run
      - contains:
          path: spec.template.spec.volumes
          content:
            name: run
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S6_READ_ONLY_ROOT
            value: "1"

  - it: keeps the ServiceAccount token and Service environment out of the pod
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: omits hostUsers unless it is set explicitly
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.hostUsers

  - it: passes hostUsers through when set
    template: templates/deployment.yaml
    set:
      hostUsers: false
    asserts:
      - equal:
          path: spec.template.spec.hostUsers
          value: false

  - it: reserves ephemeral storage so a runaway download cannot fill the node
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 4Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 1Gi

  - it: stays single-writer with a Recreate rollout
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: marks the generated Secret optional and the managed Secret required
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.optional
          value: true

  - it: requires the Secret when one is managed outside the release
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: hermes-credentials
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: hermes-credentials
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.optional
          value: false

  - it: adds tcpSocket probes when the API server listener is enabled
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: hermes-credentials
      apiServer.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8642
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: 8642
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: 8642

  - it: never overrides an explicit probe
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: hermes-credentials
      apiServer.enabled: true
      probes.liveness:
        httpGet:
          path: /health
          port: 8642
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket

  - it: blocks npm lifecycle scripts when extra packages are installed
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: hermes-credentials
      npm.enabled: true
      npm.packages:
        - "@modelcontextprotocol/server-filesystem"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: npm-install
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: --ignore-scripts
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: --registry "https://registry\.npmjs\.org"

  - it: renders nothing in operator mode
    template: templates/deployment.yaml
    set:
      operator.enabled: true
      operator.tenants:
        - name: tenant-a
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the data volume when the release is uninstalled
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: can be told to let the volume go
    template: templates/pvc.yaml
    set:
      persistence.keepOnUninstall: false
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]

  - it: keeps caller annotations alongside the retain policy
    template: templates/pvc.yaml
    set:
      persistence.annotations:
        example.com/team: platform
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["example.com/team"]
          value: platform
