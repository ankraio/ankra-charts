    - name: hermes-agent
      image: docker.io/nousresearch/hermes-agent:v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf
  artifacthub.io/changes: |
    - kind: added
      description: "The data volume now carries helm.sh/resource-policy: keep by default, so `helm uninstall` no longer deletes the agent's memory, sessions and platform pairings. Set persistence.keepOnUninstall=false for the old behaviour."
    - kind: fixed
      description: "0.1.1 started but the agent could not write its state on a PersistentVolume: HERMES_UID silently no-ops under a read-only root filesystem, so the agent keeps the image's native uid 10000 while fsGroup owned the volume as 1000. The chart now aligns on 10000 and the bootstrap init container chowns the data volume."
    - kind: fixed
      description: "0.1.0 could not start: the image runs s6-overlay as PID 1 and its bootstrap refuses a pinned non-root UID, so the hardened podSecurityContext produced a CrashLoopBackOff. The pod now enters as root and drops to env.HERMES_UID, keeps a read-only root filesystem via a writable /run, and pinning runAsUser is refused at render time with an explanation."
