  artifacthub.io/prerelease: "false"
  artifacthub.io/maintainers: |
    - name: Ankra AB
      email: admin@ankra.io
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/ankraio/ankra-charts/tree/main/hermes-agent
    - name: Helm repo (helm repo add)
      url: https://ankraio.github.io/ankra-charts
    - name: Chart (OCI)
      url: oci://ghcr.io/ankraio/ankra-charts/hermes-agent
    - name: Upstream project
      url: https://github.com/NousResearch/hermes-agent
  artifacthub.io/operator: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/ankraio/ankra-charts#verifying-a-published-chart
  artifacthub.io/images: |
    - name: hermes-agent
      image: docker.io/nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
  artifacthub.io/changes: |
    - kind: added
      description: "Several model endpoints at once: config.values.providers declares named OpenAI-compatible endpoints with their own key_env, model.provider picks the main one, /model switches between them, and config.values.fallback_providers is the failover chain Hermes moves to on 429/5xx/401/404 without losing the conversation. values-examples/multi-provider.yaml shows Salad plus an in-cluster Claude Code wrapper side by side."
    - kind: security
      description: "An inline api_key on the main model, a named provider or a fallback entry is refused unless hardening.allowInlineSecrets=true."
    - kind: fixed
      description: "A model endpoint on a .svc, .cluster.local, loopback or RFC1918 address is refused at render time unless networkPolicy.egress.extra carries a rule for it: the default egress excludes private networks, so such a deployment came up green and then had every model call dropped by its own policy."
    - kind: fixed
      description: "A key_env nothing in the release puts on the pod, a fallback entry missing provider or model, and a model.base_url contradicting a named model.provider are refused at render time instead of being silently ignored by Hermes."
