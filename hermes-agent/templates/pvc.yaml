{{- if not .Values.operator.enabled }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes-agent.pvcName" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  {{- $pvcAnnotations := deepCopy (.Values.persistence.annotations | default dict) }}
  {{- if .Values.persistence.keepOnUninstall }}
  {{- $_ := set $pvcAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- with $pvcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
{{- end }}
