{{- if not .Values.operator.enabled }}
{{- if or .Values.networkPolicy.enabled .Values.tenantIsolation.enabled }}
{{- $servicePorts := include "hermes-agent.servicePorts" . | fromJsonArray -}}
{{- $egressValues := .Values.networkPolicy.egress -}}

{{- $allowedNamespaces := list -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.ingress.allowSameNamespace -}}
{{- $allowedNamespaces = append $allowedNamespaces .Release.Namespace -}}
{{- end -}}
{{- if and .Values.tenantIsolation.enabled .Values.tenantIsolation.allowSameNamespace -}}
{{- $allowedNamespaces = append $allowedNamespaces .Release.Namespace -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $allowedNamespaces = concat $allowedNamespaces .Values.networkPolicy.ingress.allowedNamespaces -}}
{{- end -}}
{{- if .Values.tenantIsolation.enabled -}}
{{- $allowedNamespaces = concat $allowedNamespaces .Values.tenantIsolation.authorizedNamespaces -}}
{{- end -}}
{{- $allowedNamespaces = $allowedNamespaces | uniq | sortAlpha -}}

{{- $ingressRules := list -}}
{{- if and (gt (len $allowedNamespaces) 0) (gt (len $servicePorts) 0) -}}
{{- $ingressPorts := list -}}
{{- range $servicePorts -}}
{{- $ingressPorts = append $ingressPorts (dict "protocol" (default "TCP" .protocol) "port" (.port | int)) -}}
{{- end -}}
{{- $namespaceSelector := dict "namespaceSelector" (dict "matchExpressions" (list (dict "key" "kubernetes.io/metadata.name" "operator" "In" "values" $allowedNamespaces))) -}}
{{- $ingressRules = append $ingressRules (dict "from" (list $namespaceSelector) "ports" $ingressPorts) -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $ingressRules = concat $ingressRules .Values.networkPolicy.ingress.extra -}}
{{- end -}}

{{- $egressRules := list -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowDns -}}
{{- $dnsSelector := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicy.dnsNamespace)) -}}
{{- $dnsPorts := list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53) -}}
{{- $egressRules = append $egressRules (dict "to" (list $dnsSelector) "ports" $dnsPorts) -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled $egressValues.allowPublicInternet -}}
{{- $publicPorts := list -}}
{{- range $egressValues.ports -}}
{{- $publicPorts = append $publicPorts (dict "protocol" (default "TCP" .protocol) "port" (.port | int)) -}}
{{- end -}}
{{- $ipBlocks := list (dict "ipBlock" (dict "cidr" "0.0.0.0/0" "except" $egressValues.excludedCidrs)) -}}
{{- if $egressValues.ipv6 -}}
{{- $ipBlocks = append $ipBlocks (dict "ipBlock" (dict "cidr" "::/0" "except" $egressValues.excludedCidrsIPv6)) -}}
{{- end -}}
{{- $egressRules = append $egressRules (dict "to" $ipBlocks "ports" $publicPorts) -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $egressRules = concat $egressRules $egressValues.extra -}}
{{- end -}}
{{- if .Values.tenantIsolation.enabled -}}
{{- $egressRules = concat $egressRules .Values.tenantIsolation.additionalEgress -}}
{{- end -}}

{{- $policyTypes := list "Ingress" -}}
{{- if or .Values.networkPolicy.enabled (gt (len $egressRules) 0) -}}
{{- $policyTypes = list "Ingress" "Egress" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hermes-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
  {{- if gt (len $ingressRules) 0 }}
  ingress:
    {{- toYaml $ingressRules | nindent 4 }}
  {{- end }}
  {{- if gt (len $egressRules) 0 }}
  egress:
    {{- toYaml $egressRules | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
