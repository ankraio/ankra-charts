{{- if not .Values.operator.enabled }}
{{- include "hermes-agent.validate" . -}}
{{- $mountPath := .Values.persistence.mountPath -}}
{{- $servicePorts := include "hermes-agent.servicePorts" . | fromJsonArray -}}
{{- $npmEnabled := and .Values.npm.enabled (gt (len .Values.npm.packages) 0) -}}
{{- $bootstrapConfigPath := printf "/bootstrap/%s" .Values.bootstrap.configKey -}}
{{- $bootstrapSoulPath := printf "/bootstrap/%s" .Values.bootstrap.soulKey -}}
{{- $overwrite := ternary "true" "false" .Values.bootstrap.overwrite -}}
{{- $image := include "hermes-agent.image" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "hermes-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.bootstrap.existingConfigMap }}
        checksum/config: {{ printf "%s|%s|%s" .Values.bootstrap.existingConfigMap .Values.bootstrap.configKey .Values.bootstrap.soulKey | sha256sum }}
        {{- else }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.externalSecret.enabled }}
        checksum/external-secret: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        {{- else if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hermes-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- if not (kindIs "invalid" .Values.hostUsers) }}
      hostUsers: {{ .Values.hostUsers }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.bootstrap.enabled $npmEnabled .Values.extraInitContainers }}
      initContainers:
        {{- if .Values.bootstrap.enabled }}
        - name: bootstrap-config
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              # fsGroup sets the group of the volume but not its owner, and the
              # image only chowns paths it creates, so a pre-existing volume
              # root stays root-owned and the agent cannot write its state
              # there. This init container is root and does not go through the
              # image entrypoint, so it can put that right.
              chown -R "${HERMES_UID}:${HERMES_GID}" {{ $mountPath | quote }}
              mkdir -p {{ printf "%s/home" $mountPath | quote }}
              if [ -f {{ $bootstrapConfigPath | quote }} ]; then
                if [ "{{ $overwrite }}" = "true" ] || [ ! -f {{ printf "%s/config.yaml" $mountPath | quote }} ]; then
                  cp {{ $bootstrapConfigPath | quote }} {{ printf "%s/config.yaml" $mountPath | quote }}
                fi
              fi
              if [ -f {{ $bootstrapSoulPath | quote }} ]; then
                if [ "{{ $overwrite }}" = "true" ] || [ ! -f {{ printf "%s/SOUL.md" $mountPath | quote }} ]; then
                  cp {{ $bootstrapSoulPath | quote }} {{ printf "%s/SOUL.md" $mountPath | quote }}
                fi
              fi
          env:
            - name: HERMES_HOME
              value: {{ $mountPath | quote }}
            - name: HERMES_UID
              value: {{ (.Values.env | default dict).HERMES_UID | default "10000" | quote }}
            - name: HERMES_GID
              value: {{ (.Values.env | default dict).HERMES_GID | default "10000" | quote }}
          volumeMounts:
            - name: data
              mountPath: {{ $mountPath }}
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- if $npmEnabled }}
        - name: npm-install
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              prefix={{ printf "%s/npm-global" $mountPath | quote }}
              mkdir -p {{ printf "%s/home" $mountPath | quote }} "$prefix"
              hash_file="$prefix/.helm-npm-packages-hash"
              desired_hash={{ printf "%s|%s|%v" (join "," .Values.npm.packages) .Values.npm.registry .Values.npm.ignoreScripts | sha256sum | quote }}
              current_hash=""
              if [ -f "$hash_file" ]; then
                current_hash="$(cat "$hash_file" 2>/dev/null || true)"
              fi
              if [ "$current_hash" != "$desired_hash" ]; then
                npm install --global --prefix "$prefix" \
                  --registry {{ .Values.npm.registry | quote }} \
                  {{ if .Values.npm.ignoreScripts }}--ignore-scripts {{ end }}--no-fund --no-audit \
                  {{- range .Values.npm.packages }} {{ . | quote }}{{- end }}
                npm cache clean --force || true
                printf '%s\n' "$desired_hash" > "$hash_file"
              fi
          env:
            - name: HOME
              value: {{ printf "%s/home" $mountPath | quote }}
            - name: NPM_CONFIG_PREFIX
              value: {{ printf "%s/npm-global" $mountPath | quote }}
          volumeMounts:
            - name: data
              mountPath: {{ $mountPath }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: hermes-agent
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          workingDir: {{ .Values.workingDir }}
          env:
            - name: HERMES_HOME
              value: {{ $mountPath | quote }}
            - name: HOME
              value: {{ printf "%s/home" $mountPath | quote }}
            # s6-overlay refuses to start on a read-only root filesystem unless
            # it is told to expect one; /run below is the writable path it needs.
            - name: S6_READ_ONLY_ROOT
              value: "1"
            {{- if .Values.camofox.enabled }}
            # Setting this is what makes Hermes route every browser tool
            # through Camofox instead of agent-browser or Browserbase.
            - name: CAMOFOX_URL
              value: {{ include "hermes-agent.camofoxUrl" . | quote }}
            {{- end }}
            {{- if $npmEnabled }}
            - name: PATH
              value: {{ printf "%s/npm-global/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" $mountPath | quote }}
            - name: NODE_PATH
              value: {{ printf "%s/npm-global/lib/node_modules" $mountPath | quote }}
            - name: NPM_CONFIG_PREFIX
              value: {{ printf "%s/npm-global" $mountPath | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ printf "%v" $value | quote }}
            {{- end }}
            {{- if .Values.apiServer.enabled }}
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: {{ .Values.apiServer.host | quote }}
            - name: API_SERVER_PORT
              value: {{ .Values.apiServer.port | quote }}
            - name: API_SERVER_CORS_ORIGINS
              value: {{ .Values.apiServer.corsOrigins | quote }}
            - name: API_SERVER_MODEL_NAME
              value: {{ .Values.apiServer.modelName | quote }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: {{ .Values.webhook.port | quote }}
            {{- end }}
            {{- if .Values.telegramWebhook.enabled }}
            - name: TELEGRAM_WEBHOOK_URL
              value: {{ .Values.telegramWebhook.url | quote }}
            - name: TELEGRAM_WEBHOOK_PORT
              value: {{ .Values.telegramWebhook.port | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hermes-agent.secretName" . }}
                optional: {{ not (include "hermes-agent.secretManagedExternally" .) }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if gt (len $servicePorts) 0 }}
          ports:
            {{- range $index, $port := $servicePorts }}
            - name: {{ default (printf "port-%d" $index) $port.name }}
              containerPort: {{- if hasKey $port "containerPort" }} {{ $port.containerPort | int }}{{- else if and (hasKey $port "targetPort") (not (kindIs "string" $port.targetPort)) }} {{ $port.targetPort | int }}{{- else }} {{ $port.port | int }}{{- end }}
              protocol: {{ default "TCP" $port.protocol }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- else if .Values.apiServer.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.apiServer.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- else if .Values.apiServer.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.apiServer.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- if .Values.probes.startup }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          {{- else if .Values.apiServer.enabled }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.apiServer.port }}
            periodSeconds: 10
            failureThreshold: 30
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ $mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            {{- if .Values.browser.shm.enabled }}
            - name: dshm
              mountPath: {{ .Values.browser.shm.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.camofox.enabled }}
        - name: camofox
          image: {{ include "hermes-agent.camofoxImage" . | quote }}
          imagePullPolicy: {{ .Values.camofox.image.pullPolicy }}
          env:
            - name: CAMOFOX_PORT
              value: {{ .Values.camofox.port | quote }}
            - name: MAX_OLD_SPACE_SIZE
              value: {{ .Values.camofox.maxOldSpaceSize | quote }}
            {{- if not .Values.camofox.defaultAddons }}
            - name: CAMOFOX_DISABLE_DEFAULT_ADDONS
              value: "1"
            {{- end }}
            {{- range $key, $value := .Values.camofox.extraEnv }}
            - name: {{ $key }}
              value: {{ printf "%v" $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hermes-agent.secretName" . }}
                optional: {{ not (include "hermes-agent.secretManagedExternally" .) }}
          ports:
            - name: camofox
              containerPort: {{ .Values.camofox.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: camofox
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: camofox
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.camofox.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.camofox.securityContext | nindent 12 }}
          volumeMounts:
            - name: camofox-tmp
              mountPath: /tmp
            {{- if .Values.camofox.shm.enabled }}
            - name: camofox-dshm
              mountPath: /dev/shm
            {{- end }}
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "hermes-agent.pvcName" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: bootstrap
          configMap:
            name: {{ include "hermes-agent.bootstrapConfigMapName" . }}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        {{- if .Values.camofox.enabled }}
        - name: camofox-tmp
          emptyDir: {}
        {{- if .Values.camofox.shm.enabled }}
        - name: camofox-dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.camofox.shm.sizeLimit | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.browser.shm.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.browser.shm.sizeLimit | quote }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $affinity := deepCopy (.Values.affinity | default dict) }}
      {{- if and .Values.tenantIsolation.enabled .Values.tenantIsolation.podAntiAffinity.enabled .Values.tenant.id }}
        {{- $tenantTerm := dict "labelSelector" (dict "matchExpressions" (list (dict "key" (include "hermes-agent.tenantLabelKey" .) "operator" "In" "values" (list .Values.tenant.id)))) "topologyKey" .Values.tenantIsolation.podAntiAffinity.topologyKey }}
        {{- $tenantAffinity := dict }}
        {{- if eq .Values.tenantIsolation.podAntiAffinity.type "requiredDuringSchedulingIgnoredDuringExecution" }}
          {{- $tenantAffinity = dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $tenantTerm)) }}
        {{- else }}
          {{- $tenantAffinity = dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "weight" 100 "podAffinityTerm" $tenantTerm))) }}
        {{- end }}
        {{- $affinity = mergeOverwrite $affinity $tenantAffinity }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
